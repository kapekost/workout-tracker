services:
  workout-tracker:
    # Run only — never builds here. A 1 GB Pi can't compile the Vite frontend.
    # The image is built on the Mac and transferred straight to the Pi (no registry):
    #   docker save kapekost/workout-tracker:$APP_COMMIT | gzip | ssh PI 'gunzip | docker load'
    # NOTE: no `build:` key (a failed pull must not trigger an on-device build),
    # and pull_policy: never (the image is loaded locally, not fetched from a registry).
    # Tag is pinned to the commit that was built, not :latest, so a stale/rolled-back tag can
    # never be ambiguous — pass APP_COMMIT=$(git rev-parse --short HEAD) when running this file.
    # Required, not defaulted (see #126): a bare `docker compose up` with no APP_COMMIT used to
    # silently fall back to :latest, which quietly rolled a live deploy back to an 11-day-old,
    # pre-auth image. Now it fails loudly instead. scripts/deploy.sh always sets this explicitly,
    # so nothing legitimate depends on a fallback — never restart this service with a bare
    # `docker compose up`.
    image: kapekost/workout-tracker:${APP_COMMIT:?APP_COMMIT must name the built image tag}
    pull_policy: never
    ports:
      # host:container — 8080 avoids colliding with anything else on :80 on this host
      - "8080:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Secrets and per-deployment values come from a `.env` file sitting next to
    # this one, which Compose loads automatically for ${...} substitution. That
    # file is gitignored and lives only on the deploy target — see `.env.example`.
    # Every value below has a default, so a missing or partial `.env` degrades
    # (mail stops working) rather than breaking the deploy.
    environment:
      - DATABASE_URL=/app/data/workouts.db
      # Session dates use local wall-clock; without this the container is UTC
      # and a workout logged after midnight local lands on the previous day.
      - TZ=Europe/London
      # What emailed invite/reset links point at. Wrong value = a link nobody
      # can open, so it has no silent default.
      - APP_BASE_URL=${APP_BASE_URL:-}
      # 1 only once something in front of this app terminates TLS. Setting it
      # early breaks login silently: the browser takes the cookie and never
      # sends it back.
      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE:-0}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
