services:
  workout-tracker:
    # Run only — never builds here. The image is built on the Mac and transferred
    # straight to the Pi (no registry). IMAGE_TAG must identify an already-loaded
    # image; do not fall back to :latest so rollback remains reproducible.
    image: kapekost/workout-tracker:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: never
    ports:
      # host:container — 8080 avoids colliding with anything else on :80 on this host
      - "8080:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - DATABASE_URL=/app/data/workouts.db
      # Session dates use local wall-clock; without this the container is UTC
      # and a workout logged after midnight local lands on the previous day.
      - TZ=Europe/London
