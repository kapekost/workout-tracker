name: Scaffold sanity

# Validates the agent-scaffold machinery itself (label/dependabot config,
# no committed secrets) — NOT the application. It is deliberately not named
# "CI": a green check here says nothing about whether the app's own tests,
# build, or lint passed. If this project has (or gets) real application
# CI, that workflow is the one that should be a required status check.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Copier renders this file as Jinja. The value below wraps GitHub
  # Actions' own double-curly-brace syntax in a Jinja "raw" block so
  # Copier doesn't try to parse it as a template expression.
  group: scaffold-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate YAML config files
        run: |
          for f in .github/labels.yml .github/dependabot.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
          done

      # An env file must never be tracked. This is the accident the whole
      # .env-on-the-target mechanism exists to prevent, so it is checked
      # directly rather than left to the pattern scan below — a committed .env
      # is wrong even if today's contents happen to look harmless.
      - name: No env files tracked
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Env file(s) committed: $tracked"
            echo "Real values belong in a .env on the deploy target. See .env.example."
            exit 1
          fi

      # Scan every tracked file, not just .mcp.json. The narrow version of this
      # check would not have caught a key pasted into a script, a doc, or a
      # committed .env — and "keys never go in tracked files" is only a rule if
      # something enforces it.
      #
      # *.example files are excluded (they hold deliberate placeholders), and so
      # is this workflow, which necessarily contains the patterns themselves.
      - name: Check for committed secrets
        run: |
          patterns='re_[A-Za-z0-9]{24,}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}'
          patterns="$patterns|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{10,}|ya29\.[A-Za-z0-9_-]{20,}"
          patterns="$patterns|tskey-[A-Za-z0-9-]{16,}|xox[baprs]-[A-Za-z0-9-]{10,}"
          patterns="$patterns|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY"
          hits=0
          while IFS= read -r f; do
            case "$f" in
              *.example|.github/workflows/scaffold-sanity.yml) continue ;;
            esac
            if grep -EIn "$patterns" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Possible committed secret in $f"
              grep -EIn "$patterns" "$f" | sed -E 's/(.{12}).*/\1.../' | head -3
              hits=1
            fi
          done <<< "$(git ls-files)"
          if [ "$hits" -ne 0 ]; then
            echo "If this is a real credential: rotate it first, then remove it."
            exit 1
          fi

      # #132: this repo is public and its GUARDRAILS say deployment/co-located-
      # service knowledge stays in the gitignored AGENTS.local.md, never a
      # tracked file — but nothing enforced that, which is exactly how the real
      # Pi IP, SSH key path, and the co-located service's name ended up in
      # docs, a backend comment, and a test file. Separate from the secrets
      # check above: these aren't credential-shaped, so that pattern set would
      # never have caught them.
      #
      # docs/orchestration/{DECISIONS,HISTORY}.md are append-only logs — they
      # record what was actually decided/done at the time, including naming
      # the co-located service in explaining *why* (e.g. this exact scrub).
      # Redacting past entries would misrepresent the record; #132's history
      # rewrite (not a forward patch here) is the mechanism for that half.
      - name: Check for deploy-target specifics
        run: |
          patterns='192\.168\.|\.ts\.net|id_raspi|home ?assistant'
          hits=0
          while IFS= read -r f; do
            case "$f" in
              *.example|.github/workflows/scaffold-sanity.yml) continue ;;
              docs/orchestration/DECISIONS.md|docs/orchestration/HISTORY.md) continue ;;
            esac
            if grep -EIn "$patterns" "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Deploy-target or co-located-service specifics in $f"
              grep -EIn "$patterns" "$f" | head -3
              hits=1
            fi
          done <<< "$(git ls-files)"
          if [ "$hits" -ne 0 ]; then
            echo "Real values belong in AGENTS.local.md (gitignored). See its 'Deploy target' /"
            echo "'Co-located services' sections and the placeholder pattern scripts/deploy.sh uses."
            exit 1
          fi
