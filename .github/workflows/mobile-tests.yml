name: Mobile tests

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-tests.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-tests.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Fail when a package is off the version this Expo SDK expects.
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test

      # Metro bundling catches bad imports and Babel errors that tsc does not.
      - run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/export"
