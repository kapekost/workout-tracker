name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous: this job installs a browser before the e2e suite, so the
    # floor is not the tests. It is a ceiling, so a hung run cannot burn a
    # runner indefinitely — the review workflow sat 28 minutes on run 3.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fast unit suite first: fails in ~10s, before paying for a browser install.
      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
