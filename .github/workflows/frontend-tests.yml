name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous: this job installs a browser before the e2e suite, so the
    # floor is not the tests. It is a ceiling, so a hung run cannot burn a
    # runner indefinitely — the review workflow sat 28 minutes on run 3.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # The browser is ~500MB and was being downloaded on every single run.
      # This suite is the largest block of CI wall-clock for the repo (53 of ~76
      # non-review minutes over 14 days), and all of that saving is wall-clock
      # rather than money — standard runner minutes are free on this public repo.
      # Keyed on the lockfile hash, so the cache turns over exactly when
      # Playwright is upgraded. Note GitHub expressions cannot run shell
      # (`${{ node -e ... }}` does not work); hashFiles is the supported way.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - run: npm ci

      # Fast unit suite first: fails in ~10s, before paying for a browser install.
      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
